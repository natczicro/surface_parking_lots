<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkingScope — Surface Parking Near Metro Stations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        /* Light wash overlay so text stays readable */
        .bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.62);
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            max-width: 540px;
            width: 100%;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.75);
            border: 1px solid rgba(0,0,0,0.1);
            color: #374151;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 1.6rem;
            backdrop-filter: blur(8px);
        }

        h1 {
            font-size: 2.9rem;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.03em;
            color: #111827;
            margin-bottom: 1rem;
        }

        h1 .highlight {
            color: #0d9488;
        }

        .subtitle {
            color: #6b7280;
            font-size: 1rem;
            line-height: 1.65;
            font-weight: 400;
            margin-bottom: 2.2rem;
        }

        /* Card */
        .card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 18px;
            padding: 1.75rem;
            box-shadow: 0 8px 40px rgba(0,0,0,0.1), 0 1px 4px rgba(0,0,0,0.06);
        }

        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .input-group.wide { flex: 2; }

        .input-label {
            font-size: 0.72rem;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 6px;
            text-align: left;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 9px;
            color: #111827;
            font-family: 'Inter', sans-serif;
            font-size: 0.93rem;
            padding: 10px 13px;
            outline: none;
            transition: border-color 0.18s, box-shadow 0.18s;
        }

        input::placeholder { color: #9ca3af; }

        input:focus {
            border-color: #0d9488;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
        }

        .submit-btn {
            width: 100%;
            background: #0d9488;
            border: none;
            border-radius: 9px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.93rem;
            font-weight: 600;
            padding: 12px 24px;
            cursor: pointer;
            letter-spacing: 0.2px;
            transition: background 0.18s, transform 0.1s, box-shadow 0.18s;
            box-shadow: 0 4px 14px rgba(13, 148, 136, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }

        .submit-btn:hover {
            background: #0f766e;
            box-shadow: 0 6px 20px rgba(13, 148, 136, 0.4);
            transform: translateY(-1px);
        }

        .submit-btn:active { transform: translateY(0); }

        .submit-btn svg { transition: transform 0.18s; }
        .submit-btn:hover svg { transform: translateX(3px); }

        .footer-note {
            margin-top: 1.3rem;
            color: rgba(0,0,0,0.35);
            font-size: 0.74rem;
        }

        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .form-row { flex-direction: column; }
        }
    </style>
</head>

        <h1>Surface Parking<br>Near <span class="highlight">Metro Stations</span></h1>
        <p class="subtitle">Measure how much urban land is consumed by surface parking lots around transit hubs in any city.</p>

                    <div class="input-group wide">

                            id="city"
                            name="city"
                            placeholder="e.g. Toronto, Tokyo, Berlin"
