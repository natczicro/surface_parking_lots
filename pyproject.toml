[project]
name = "surface-parking-lots"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.2",
    "folium>=0.20.0",
    "numpy>=2.3.5",
    "pyproj>=3.7.2",
    "requests>=2.32.5",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
